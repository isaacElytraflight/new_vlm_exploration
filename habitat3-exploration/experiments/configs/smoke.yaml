# Goal C smoke matrix: 4 brains × 1 scene × 2 seeds (8 runs).
# Fresh Elytra campaigns use folder name ablation_run_<timestamp> (overrides this id).
experiment_id: ablation_run
n_runs_per_cell: 2
timeout_s: 7200
artifact_root: sim/data/experiments

eval:
  fov_deg: 360
  reveal_radius_m: 5.0

algorithms:
  - id: vlm_dfs
    brain: vlm_tree_dfs
  - id: greedy_nearest
    brain: greedy_nearest
  - id: vlm_frontier_graph
    brain: vlm_frontier_graph
  - id: vlm_choice_dijkstra
    brain: vlm_choice_dijkstra

scenes:
  - JmbYfDe2QKZ

seeds:
  mode: sequential
  start: 0
